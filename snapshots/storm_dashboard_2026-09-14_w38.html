<style>

:root {
  --thd: #F96302; --thd-l: #FF9B52; --thd-d: #C74E00;
  --low: #004990; --low-l: #3B7FC4;
  --wmt: #0071CE; --wmt-l: #00A3E0;
  --green: #34C759; --red: #FF3B30; --yellow: #FF9500;
  --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --text2: #6e6e73; --text3: #aeaeb2;
  --border: #e5e5ea; --shadow: 0 2px 12px rgba(0,0,0,0.04);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); padding: 20px 24px; font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.header .meta { display: flex; gap: 8px; }
.pill { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: rgba(0,0,0,0.05); color: var(--text2); }
.kpi-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--card); border-radius: var(--radius); padding: 18px 14px; box-shadow: var(--shadow); text-align: center; border-top: 3px solid transparent; }
.kpi.green { border-top-color: var(--green); } .kpi.red { border-top-color: var(--red); } .kpi.yellow { border-top-color: var(--yellow); }
.kpi-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 6px; }
.kpi-num { font-size: 24px; font-weight: 800; letter-spacing: -0.8px; color: var(--text); }
.kpi-sub { font-size: 11px; font-weight: 600; color: var(--text2); margin-top: 4px; }
.nav { display: flex; gap: 4px; margin-bottom: 20px; padding: 4px; background: rgba(0,0,0,0.04); border-radius: 12px; }
.nav button { padding: 9px 16px; border: none; background: transparent; color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 9px; transition: all 0.15s; font-family: var(--font); }
.nav button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.nav button:hover:not(.on) { color: var(--text); }
.panel { display: none; } .panel.on { display: block; }
.card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.sec { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; letter-spacing: -0.2px; }
table { width: 100%; border-collapse: collapse; }
table th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); padding: 10px 12px 8px; border-bottom: 2px solid var(--border); }
table td { padding: 11px 12px; border-bottom: 1px solid #f2f2f7; font-size: 14px; font-weight: 700; color: var(--text); font-family: var(--mono); }
table tr:last-child td { border-bottom: none; }
table tr:hover td { background: #fafafa; }
td.name { font-family: var(--font); font-weight: 600; font-size: 13px; }
.pos { color: var(--green); } .neg { color: var(--red); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot-g { background: var(--green); } .dot-y { background: var(--yellow); } .dot-r { background: var(--red); }
.fbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.fbar label { font-size: 12px; font-weight: 700; color: var(--text2); }
.fbar select { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; background: var(--card); color: var(--text); font-family: var(--font); }
.conc-card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); border-left: 4px solid; }
.conc-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
.conc-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.7; align-items: flex-start; font-weight: 500; }
.conc-item:last-child { margin-bottom: 0; }
.badge-r { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #FFEBEE; color: #C62828; white-space: nowrap; margin-top: 3px; }
.badge-o { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #E8F5E9; color: #2E7D32; white-space: nowrap; margin-top: 3px; }
.badge-w { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #FFF8E1; color: #E65100; white-space: nowrap; margin-top: 3px; }

</style>

  charts.bcm=Highcharts.chart('c-bcm',{chart:{type:'column'},title:{text:'Brand CM%'},

    yAxis:{labels:{format:'{value}%'},plotLines:[{value:5,color:'#3b82f6',width:2,dashStyle:'Dash',label:{text:'5%',style:{fontWeight:'800',color:'#3b82f6'}}}]},
    plotOptions:{column:{borderRadius:5,dataLabels:{enabled:true,format:'{point.y:.1f}%',style:{fontSize:'14px',fontWeight:'800'}}}},
    series:[{data:P.brand_performance.map(function(b){return{y:b.cm_display,color:b.cm_display>=5?'#34C759':'#FF3B30'};})}]
  });
  if(charts.pcm)charts.pcm.destroy();
  charts.pcm=Highcharts.chart('c-pcm',{chart:{type:'column'},title:{text:'Power Source CM%'},
    xAxis:{categories:P.power_source.map(function(p){return p.source;}),labels:{style:{fontWeight:'700'}}},
    yAxis:{labels:{format:'{value}%'},plotLines:[{value:5,color:'#3b82f6',width:2,dashStyle:'Dash'}]},
    plotOptions:{column:{borderRadius:5,dataLabels:{enabled:true,format:'{point.y:.1f}%',style:{fontSize:'14px',fontWeight:'800'}}}},
    series:[{data:P.power_source.map(function(p){return{y:p.cm_display,color:p.cm_display>=5?'#34C759':'#FF3B30'};})}]
  });
  if(charts.brev)charts.brev.destroy();
  charts.brev=Highcharts.chart('c-brev',{chart:{type:'pie'},title:{text:'Revenue by Brand'},colors:['#3b82f6','#FF9500'],
    plotOptions:{pie:{borderRadius:4,dataLabels:{format:'<b>{point.name}</b><br>{point.percentage:.0f}%',style:{fontSize:'12px',fontWeight:'700'}}}},
    series:[{data:P.brand_performance.map(function(b){return{name:b.brand,y:b.revenue};})}]
  });
  if(charts.prev)charts.prev.destroy();
  charts.prev=Highcharts.chart('c-prev',{chart:{type:'pie'},title:{text:'Revenue by Power Source'},colors:['#34C759','#06b6d4','#8b5cf6','#FF9500'],
    plotOptions:{pie:{borderRadius:4,dataLabels:{format:'<b>{point.name}</b><br>{point.percentage:.0f}%',style:{fontSize:'12px',fontWeight:'700'}}}},
    series:[{data:P.power_source.map(function(p){return{name:p.source,y:p.revenue};})}]
  });
}

function renderCatBrand(platform){
  var P=getP();
  var data=P.category_brand_by_platform[platform]||P.category_brand_heatmap;
  var catSet={};var cats=[];
  data.forEach(function(d){if(!catSet[d.category]){catSet[d.category]=1;cats.push(d.category);}});
  var bData=cats.map(function(c){var f=null;data.forEach(function(d){if(d.category===c&&d.brand==='Badger')f=d;});return f?f.revenue:0;});
  var sData=cats.map(function(c){var f=null;data.forEach(function(d){if(d.category===c&&d.brand==='Sunseeker')f=d;});return f?f.revenue:0;});
  if(charts.cat)charts.cat.destroy();
  charts.cat=Highcharts.chart('c-catbrand',{chart:{type:'bar'},title:{text:null},
    subtitle:{text:'Badger CM '+P.brand_cm.Badger+'% | Sunseeker CM '+P.brand_cm.Sunseeker+'%',style:{fontWeight:'700',fontSize:'11px'}},
    xAxis:{categories:cats,labels:{style:{fontSize:'11px',fontWeight:'600'}}},
    yAxis:{title:null,labels:{formatter:function(){return fmt$(this.value)}}},
    plotOptions:{bar:{stacking:'normal',borderRadius:2,dataLabels:{enabled:true,formatter:function(){return this.y>500?fmt$(this.y):''},style:{fontSize:'10px',fontWeight:'700',textOutline:'none'}}}},
    series:[{name:'Badger',data:bData,color:'#3b82f6'},{name:'Sunseeker',data:sData,color:'#FF9500'}]
  });
}

function renderSKU(){
  var P=getP();
  var allCh=[];P.top_skus.forEach(function(s){s.platform_breakdown.forEach(function(p){if(allCh.indexOf(p.channel)<0)allCh.push(p.channel);});});
  if(charts.sku)charts.sku.destroy();
  charts.sku=Highcharts.chart('c-sku',{chart:{type:'bar'},title:{text:'Top 10 SKU Revenue'},
    xAxis:{categories:P.top_skus.map(function(s){return s.sku;}),labels:{style:{fontWeight:'700'}}},
    yAxis:{labels:{formatter:function(){return fmt$(this.value)}},stackLabels:{enabled:true,formatter:function(){return fmt$(this.total)},style:{fontSize:'11px',fontWeight:'800'}}},
    plotOptions:{bar:{stacking:'normal',borderRadius:2}},
    series:allCh.map(function(ch){return{name:ch,color:CC[ch]||'#94a3b8',data:P.top_skus.map(function(s){var f=null;s.platform_breakdown.forEach(function(p){if(p.channel===ch)f=p;});return f?f.revenue:0;})};})
  });
}

function renderSkuWow(p){
  var P=getP();var g,d;
  if(p==='All'){g=P.sku_wow_growth;d=P.sku_wow_decline;}
  else{var pw=P.platform_sku_wow[p];g=pw?pw.growth:[];d=pw?pw.decline:[];}
  $('wg-t').innerHTML=g.map(function(s){return'<tr><td class="name">'+s.sku+'</td><td>'+fmt$(s.w1)+'</td><td>'+fmt$(s.w2)+'</td><td class="pos">+'+fmt$(Math.abs(s.change))+'</td></tr>';}).join('');
  $('wd-t').innerHTML=d.map(function(s){return'<tr><td class="name">'+s.sku+'</td><td>'+fmt$(s.w1)+'</td><td>'+fmt$(s.w2)+'</td><td class="neg">'+fmt$(s.change)+'</td></tr>';}).join('');
}

// DFC (independent)
var dfcS=$('dfc-sel');
DATA.shared.dfc.available_months.slice().reverse().forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;dfcS.appendChild(o);});
dfcS.value=DATA.shared.dfc.available_months[0];
var dfcC;
function drawDFC(){
  var mo=dfcS.value;var daily=DATA.shared.dfc.daily_by_month[mo]||[];var skus=DATA.shared.dfc.sku_by_month[mo]||[];
  if(dfcC)dfcC.destroy();
  dfcC=Highcharts.chart('c-dfc',{chart:{type:'column'},title:{text:'DFC Daily GMV & Traffic ('+mo+')'},
    xAxis:{categories:daily.map(function(d){return d.date;}),tickInterval:Math.max(1,Math.floor(daily.length/15))},
    yAxis:[{labels:{formatter:function(){return fmt$(this.value)}}},{opposite:true}],
    tooltip:{shared:true},plotOptions:{column:{borderRadius:3}},
    series:[{name:'GMV',data:daily.map(function(d){return d.gmv;}),color:'#8b5cf6'},
            {name:'Traffic',type:'spline',yAxis:1,data:daily.map(function(d){return d.traffic;}),color:'#FF9500',lineWidth:2.5,marker:{radius:2.5}}]
  });
  $('dfc-t').innerHTML=skus.map(function(s){
    var inv=DATA.shared.dfc.inventory[s.sku];var invStr=inv!=null?fmtN(inv):'N/A';var cls=inv===0?'neg':'';
    return'<tr><td class="name">'+s.sku+'</td><td>'+fmt$(s.gmv)+'</td><td>'+fmtN(s.units)+'</td><td>'+fmtN(s.traffic)+'</td><td>'+(s.conv_rate*100).toFixed(2)+'%</td><td class="'+cls+'">'+invStr+'</td></tr>';
  }).join('');
}
drawDFC();



renderAll();
</script>
