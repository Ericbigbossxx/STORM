[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-v2"
version = "0.5.0"
description = "STORM V2 governed Sales, CM, operating-efficiency, and dashboard binding"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "duckdb>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
