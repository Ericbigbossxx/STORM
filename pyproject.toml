[project]
name = "storm-control"
version = "0.1.1"
description = "STORM Weekly Business Control contracts and adapter boundaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "uv>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
